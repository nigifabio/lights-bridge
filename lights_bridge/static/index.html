<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Lights</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💡</text></svg>">
<style>
  :root {
    --bg: #0f1115; --card: #191c23; --line: #2a2e38; --text: #eef0f4; --muted: #8b91a0;
    --accent: #ffb020; --danger: #ff6b6b; --track: #2a2e38;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f3f4f7; --card: #ffffff; --line: #e2e4ea; --text: #15171c; --muted: #6a7080; --track: #e2e4ea; }
  }
  [hidden] { display: none !important; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
  }
  header { max-width: 980px; margin: 0 auto 16px; display: flex; align-items: center; gap: 10px; }
  h1 { font-size: 22px; margin: 0; flex: 1; }
  .btn {
    border: 1px solid var(--line); background: var(--card); color: var(--text);
    padding: 9px 14px; border-radius: 999px; font: inherit; font-size: 14px; cursor: pointer;
  }
  .btn:active { transform: scale(.97); }
  main { max-width: 980px; margin: 0 auto; display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 18px; position: relative; overflow: hidden; }
  .card::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 4px; background: var(--glow, transparent); transition: background .3s; }
  .card.busy { opacity: .85; }
  .top { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .bulb { width: 44px; height: 44px; border-radius: 50%; background: var(--track); display: grid; place-items: center; font-size: 22px; transition: background .3s, box-shadow .3s; }
  .card.on .bulb { background: var(--glow); box-shadow: 0 0 22px var(--glow); }
  .name { flex: 1; min-width: 0; }
  .name b { display: block; font-size: 17px; }
  .name small { color: var(--muted); font-size: 13px; }
  .name small.err { color: var(--danger); }
  .switch { position: relative; width: 58px; height: 34px; flex: none; }
  .switch input { opacity: 0; width: 100%; height: 100%; margin: 0; position: absolute; cursor: pointer; z-index: 1; }
  .switch span { position: absolute; inset: 0; border-radius: 999px; background: var(--track); transition: background .2s; }
  .switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 28px; height: 28px; border-radius: 50%; background: #fff; box-shadow: 0 1px 4px #0006; transition: transform .2s; }
  .switch input:checked + span { background: var(--accent); }
  .switch input:checked + span::after { transform: translateX(24px); }
  .switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 18px 0 8px; font-weight: 600; display: flex; justify-content: space-between; }
  input[type=range] { width: 100%; height: 34px; margin: 0; background: transparent; -webkit-appearance: none; appearance: none; }
  input[type=range]::-webkit-slider-runnable-track { height: 10px; border-radius: 999px; background: var(--track); }
  input[type=range]::-moz-range-track { height: 10px; border-radius: 999px; background: var(--track); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 26px; height: 26px; margin-top: -8px; border-radius: 50%; background: #fff; border: 1px solid #0003; box-shadow: 0 1px 4px #0005; }
  input[type=range]::-moz-range-thumb { width: 26px; height: 26px; border-radius: 50%; background: #fff; border: 1px solid #0003; }
  .swatches { display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px; }
  .sw { aspect-ratio: 1; border-radius: 50%; border: 2px solid transparent; padding: 0; cursor: pointer; box-shadow: inset 0 0 0 1px #0002; position: relative; overflow: hidden; }
  .sw.sel { border-color: var(--text); box-shadow: 0 0 0 2px var(--card) inset; }
  .sw.custom { background: conic-gradient(red, yellow, lime, cyan, blue, magenta, red); }
  .sw.custom input { position: absolute; inset: -10px; width: 200%; height: 200%; opacity: 0; cursor: pointer; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { border: 1px solid var(--line); background: transparent; color: var(--text); padding: 8px 13px; border-radius: 999px; font: inherit; font-size: 14px; cursor: pointer; }
  .chip.sel { background: var(--accent); border-color: var(--accent); color: #1a1300; font-weight: 600; }
  .speed[hidden] { display: none; }
  .tabs { max-width: 980px; margin: 0 auto 16px; display: flex; gap: 4px; border-bottom: 1px solid var(--line); }
  .tab { background: none; border: 0; border-bottom: 3px solid transparent; color: var(--muted); font: inherit; font-size: 15px; padding: 10px 14px; cursor: pointer; margin-bottom: -1px; }
  .tab.sel { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
  #adder { max-width: 980px; margin: 0 auto 16px; }
  #adder .top { margin-bottom: 4px; }
  .dev { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); flex-wrap: wrap; }
  .dev .who { flex: 1; min-width: 150px; }
  .dev .who small { display: block; color: var(--muted); font-size: 12px; }
  .dev input, .dev select { background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font: inherit; font-size: 14px; min-width: 0; }
  .dev input { flex: 1; min-width: 110px; }
  .foot { margin-top: 18px; display: flex; justify-content: flex-end; }
  .link { background: none; border: 0; color: var(--muted); font: inherit; font-size: 13px; cursor: pointer; padding: 4px 0; text-decoration: underline; }
  .link.sure { color: var(--danger); font-weight: 600; }
  #empty { color: var(--muted); text-align: center; grid-column: 1 / -1; padding: 40px 0; }
</style>
</head>
<body>
<header>
  <h1>Lights</h1>
  <button class="btn" id="allon">All on</button>
  <button class="btn" id="alloff">All off</button>
</header>
<nav class="tabs" role="tablist">
  <button class="tab sel" role="tab" id="tab-lights" aria-selected="true">Lights</button>
  <button class="tab" role="tab" id="tab-add" aria-selected="false">Add a light</button>
</nav>
<section id="adder" class="card" hidden>
  <div class="top"><div class="name"><b>Add a light</b><small id="scanmsg">Plug the light in, close its phone app, then scan.</small></div>
    <button class="btn" id="scanbtn">Scan</button></div>
  <div id="found"></div>
</section>
<main id="lights"><div id="empty">Loading…</div></main>

<script>
const COLORS = ["#ffffff", "#ffd9a0", "#ff9d3c", "#ff0000", "#ff3d00", "#ffc400", "#b4ff00", "#00ff00",
                "#00ff9d", "#00ffff", "#0090ff", "#0000ff", "#7a00ff", "#ff00ff", "#ff0077"];
const root = document.getElementById("lights");
const cards = {};       // id -> {el, light}
const pending = {};     // id -> {patch, timer, busy}

function esc(s) { return s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

function build(light) {
  const el = document.createElement("section");
  el.className = "card";
  el.innerHTML = `
    <div class="top">
      <div class="bulb">💡</div>
      <div class="name"><b>${esc(light.name)}</b><small></small></div>
      <label class="switch"><input type="checkbox" aria-label="Power"><span></span></label>
    </div>
    <h2>Brightness <span class="bval"></span></h2>
    <input type="range" class="bright" min="1" max="100" aria-label="Brightness">
    <h2>Colour</h2>
    <div class="swatches">
      ${COLORS.map(c => `<button class="sw" data-c="${c}" style="background:${c}" aria-label="Colour ${c}"></button>`).join("")}
      <label class="sw custom" aria-label="Custom colour"><input type="color"></label>
    </div>
    <h2>Pattern</h2>
    <div class="chips">
      <button class="chip" data-p="">None</button>
      ${light.patterns.map(p => `<button class="chip" data-p="${p.id}">${esc(p.name)}</button>`).join("")}
    </div>
    <div class="speed" hidden>
      <h2>Speed</h2>
      <input type="range" class="spd" min="1" max="100" aria-label="Pattern speed">
    </div>
    <div class="foot"><button class="link rm">Remove</button></div>`;
  const id = light.id;
  el.querySelector(".switch input").onchange = e => send(id, { on: e.target.checked }, 0);
  el.querySelector(".bright").oninput = e => { el.querySelector(".bval").textContent = e.target.value + "%"; send(id, { brightness: +e.target.value }); };
  el.querySelector(".spd").oninput = e => send(id, { speed: +e.target.value });
  el.querySelectorAll(".sw[data-c]").forEach(b => b.onclick = () => send(id, { color: b.dataset.c }, 0));
  el.querySelector(".custom input").oninput = e => send(id, { color: e.target.value });
  el.querySelectorAll(".chip").forEach(b => b.onclick = () => send(id, { pattern: b.dataset.p || null }, 0));
  const rm = el.querySelector(".rm");
  rm.onclick = async () => {
    if (!rm.classList.contains("sure")) {  // two clicks instead of a dialog
      rm.classList.add("sure"); rm.textContent = "Tap again to remove";
      setTimeout(() => { rm.classList.remove("sure"); rm.textContent = "Remove"; }, 4000);
      return;
    }
    await fetch(`api/lights/${id}`, { method: "DELETE" });
    el.remove(); delete cards[id]; delete pending[id];
    load();
  };
  root.appendChild(el);
  cards[id] = { el, light };
  return cards[id];
}

function render(light, keepSliders) {
  const card = cards[light.id] || build(light);
  card.light = light;
  const el = card.el, s = light.state;
  el.classList.toggle("on", s.on);
  el.style.setProperty("--glow", s.on ? (s.pattern ? "linear-gradient(90deg,#ff3d00,#ffc400,#00ff9d,#0090ff,#ff00ff)" : s.color) : "transparent");
  el.querySelector(".switch input").checked = s.on;
  if (!keepSliders) {
    el.querySelector(".bright").value = s.brightness;
    el.querySelector(".spd").value = s.speed;
  }
  el.querySelector(".bval").textContent = s.brightness + "%";
  el.querySelectorAll(".sw[data-c]").forEach(b => b.classList.toggle("sel", !s.pattern && b.dataset.c === s.color.toLowerCase()));
  const custom = !s.pattern && !COLORS.includes(s.color.toLowerCase());
  el.querySelector(".custom").classList.toggle("sel", custom);
  el.querySelector(".custom input").value = s.color;
  el.querySelectorAll(".chip").forEach(b => b.classList.toggle("sel", (b.dataset.p || null) === s.pattern));
  el.querySelector(".speed").hidden = !s.pattern;
  const small = el.querySelector(".name small");
  small.classList.toggle("err", !!light.error);
  const m = light.music;
  const what = !s.on ? "Off" :
    s.pattern === "music" && m ? (m.playing ? `♪ ${m.title}${m.artist ? " · " + m.artist : ""} · ${m.bpm ? m.bpm + " BPM" : "tempo unknown, 120 BPM"}` : "♪ Waiting for music on Sonos") :
    s.pattern ? (light.patterns.find(p => p.id === s.pattern) || {}).name || "Pattern" : s.color.toUpperCase();
  const mark = light.confirmed === "confirmed" ? " ✓ confirmed by lamp" : light.confirmed === "delivered" ? " ✓ delivered" : "";
  small.textContent = light.error ? "⚠ " + light.error : pendingFor(light.id) ? what + " · sending…" : what + " ·" + mark;
  if (!light.error && !pendingFor(light.id) && !mark) small.textContent = what;
}

function pendingFor(id) { const q = pending[id]; return !!q && (q.busy || Object.keys(q.patch).length > 0); }

// Coalesce rapid changes (slider drags) per light: only the latest values are sent.
function send(id, patch, delay = 120) {
  const q = pending[id] || (pending[id] = { patch: {}, timer: null, busy: false });
  Object.assign(q.patch, patch);
  // optimistic update
  const light = cards[id].light;
  Object.assign(light.state, patch);
  if (patch.color) light.state.pattern = null;
  if (patch.on === false) light.state.pattern = null;
  if (patch.color || patch.pattern || patch.brightness) light.state.on = patch.on !== false;
  light.error = null;
  clearTimeout(q.timer);
  q.timer = setTimeout(() => flush(id), delay);
  render(light, true);
}

async function flush(id) {
  const q = pending[id];
  if (q.busy || !Object.keys(q.patch).length) return;
  const patch = q.patch;
  q.patch = {};
  q.busy = true;
  cards[id].el.classList.add("busy");
  try {
    const r = await fetch(`api/lights/${id}`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(patch) });
    const light = await r.json();
    q.busy = false;
    if (!Object.keys(q.patch).length) render(light, !r.ok ? false : true);
    else cards[id].light.error = light.error;
  } catch (e) {
    q.busy = false;
    cards[id].light.error = "Bridge unreachable";
    render(cards[id].light, true);
  }
  cards[id].el.classList.remove("busy");
  if (Object.keys(q.patch).length) flush(id);
}

async function load() {
  try {
    const lights = await (await fetch("api/lights")).json();
    document.getElementById("empty")?.remove();
    if (!lights.length) {
      root.innerHTML = '<div id="empty">No lights yet. Open the “Add a light” tab to scan for them.</div>';
      for (const id in cards) delete cards[id];
    }
    for (const id of Object.keys(cards)) if (!lights.some(l => l.id === id)) { cards[id].el.remove(); delete cards[id]; }
    for (const l of lights) {
      const q = pending[l.id];
      if (q && (q.busy || Object.keys(q.patch).length)) continue;  // don't fight the user
      render(l);
    }
  } catch (e) {
    const empty = document.getElementById("empty");
    if (empty) empty.textContent = "Bridge unreachable";
  }
}

// ---- add a light: scan, pick, name -------------------------------
const adder = document.getElementById("adder"), found = document.getElementById("found"),
      scanmsg = document.getElementById("scanmsg"), scanbtn = document.getElementById("scanbtn");
function showTab(add) {
  adder.hidden = !add;
  root.hidden = add;
  document.getElementById("allon").hidden = document.getElementById("alloff").hidden = add;
  for (const [id, on] of [["tab-lights", !add], ["tab-add", add]]) {
    const t = document.getElementById(id);
    t.classList.toggle("sel", on);
    t.setAttribute("aria-selected", on);
  }
}
document.getElementById("tab-lights").onclick = () => showTab(false);
document.getElementById("tab-add").onclick = () => showTab(true);
scanbtn.onclick = async () => {
  scanbtn.disabled = true; scanmsg.textContent = "Scanning for about 8 seconds…"; found.innerHTML = "";
  try {
    const r = await fetch("api/scan", { method: "POST" });
    const devs = await r.json();
    if (!r.ok) throw new Error(devs.error || "scan failed");
    const lights = devs.filter(d => d.type), others = devs.filter(d => !d.type && d.name);
    scanmsg.textContent = lights.length ? `Found ${lights.length} light${lights.length > 1 ? "s" : ""}.`
      : "No known light type found. A light that is connected to a phone app, unplugged, or IR/RF-only will not show up.";
    for (const d of lights) found.appendChild(row(d));
    if (others.length) {
      const h = document.createElement("h2"); h.textContent = "Other named devices (pick a type to try)"; found.appendChild(h);
      for (const d of others) found.appendChild(row(d));
    }
  } catch (e) { scanmsg.textContent = e.message; }
  scanbtn.disabled = false;
};
function row(d) {
  const el = document.createElement("div");
  el.className = "dev";
  const types = [["melk", "ELK-BLEDOM / MELK"], ["govee", "Govee RGBIC"]];
  el.innerHTML = `<div class="who"><b>${esc(d.name || "(no name)")}</b><small>${esc(d.address)} · signal ${d.rssi} dBm${d.label ? " · " + esc(d.label) : ""}</small></div>
    <input placeholder="Name, e.g. Desk strip" aria-label="Name" value="${d.type ? esc(d.name) : ""}">
    <select aria-label="Type">${types.map(([k, v]) => `<option value="${k}"${k === d.type ? " selected" : ""}>${v}</option>`).join("")}</select>
    <button class="btn">${d.added ? "Added" : "Add"}</button>`;
  const btn = el.querySelector("button");
  btn.disabled = d.added;
  btn.onclick = async () => {
    const r = await fetch("api/lights", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name: el.querySelector("input").value, type: el.querySelector("select").value, address: d.address }) });
    const out = await r.json();
    if (!r.ok) { scanmsg.textContent = out.error; return; }
    btn.textContent = "Added"; btn.disabled = true;
    scanmsg.textContent = `${out.name} added. It is on the Lights tab.`;
    load();
  };
  return el;
}

document.getElementById("allon").onclick = () => Object.keys(cards).forEach(id => send(id, { on: true }, 0));
document.getElementById("alloff").onclick = () => Object.keys(cards).forEach(id => send(id, { on: false }, 0));
load();
setInterval(() => { if (!document.hidden) load(); }, 5000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
</script>
</body>
</html>
